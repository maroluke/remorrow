<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weiterleitung zu WWF...</title>
    
    <!-- Plausible Analytics -->
    <script
        defer
        data-domain="remorrow.world"
        src="https://plausible.io/js/script.js"
    ></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 2rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Halt dich fest…</h1>
        <p>wir leiten dich weiter!</p>
        <div class="spinner"></div>
    </div>

    <script>
        // UTM Parameter werden automatisch von Plausible erfasst
        // Dann weiterleiten nach 2 Sekunden
        setTimeout(() => {
            window.location.href = 'https://example-wwf-event.com' + window.location.search;
        }, 2000);
    </script>
</body>
</html>
